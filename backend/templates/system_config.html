{% extends "base.html" %}
{% block title %}系统配置{% endblock %}
{% block content %}

<h4 class="mb-3">⚙️ 系统配置</h4>

<div class="card mb-4">
    <div class="card-header bg-white fw-bold">设备类别维护</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_category') }}" class="mb-4">
            <div class="input-group">
                <input type="text" name="name" class="form-control" placeholder="输入新类别名称" required>
                <button type="submit" class="btn btn-primary">添加</button>
            </div>
        </form>
        <div class="flex-wrap gap-2">
            {% for cat in categories %}
            <span class="badge bg-light text-dark px-3 py-2">
                {{ cat.name }}
                <form method="POST" action="{{ url_for('delete_category', name=cat.name) }}" style="display:inline;" onsubmit="return confirm('确认删除类别 {{ cat.name }}？');">
                    <button type="submit" class="btn btn-link p-0 ms-1 text-muted hover:text-danger"><i class="bi bi-x"></i></button>
                </form>
            </span>
            {% else %}
            <span class="text-muted">暂无自定义类别</span>
            {% endfor %}
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header bg-white fw-bold">系统信息</div>
    <div class="card-body">
        <div class="row g-4">
            <div class="col-md-4">
                <span class="text-muted small">系统版本</span>
                <div class="font-weight-bold">1.0.0</div>
            </div>
            <div class="col-md-4">
                <span class="text-muted small">数据库类型</span>
                <div class="font-weight-bold">SQLite</div>
            </div>
            <div class="col-md-4">
                <span class="text-muted small">框架版本</span>
                <div class="font-weight-bold">Flask 3.0</div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
document.querySelector('.flex-wrap').addEventListener('click', function(e) {
    const btn = e.target.closest('button');
    if (btn) {
        e.preventDefault();
        if (btn.closest('form').onsubmit()) {
            btn.closest('form').submit();
        }
    }
});
</script>
{% endblock %}
